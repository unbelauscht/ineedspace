name: Build macOS Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (ARM64, AMD64 & Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Run code validation
        run: go vet ./...

      - name: Build macOS binaries
        run: |
          mkdir -p dist
          echo "==> Building darwin/arm64 (Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/ineedspace-darwin-arm64 .
          
          echo "==> Building darwin/amd64 (Intel)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ineedspace-darwin-amd64 .

      - name: Create Universal macOS binary
        run: |
          echo "==> Packaging Universal binary with lipo..."
          lipo -create -output dist/ineedspace-darwin-universal \
            dist/ineedspace-darwin-amd64 \
            dist/ineedspace-darwin-arm64
          
          echo "==> Binary verification:"
          file dist/ineedspace-*

      - name: Smoke test binary
        run: |
          chmod +x dist/ineedspace-*
          echo "==> Testing ARM64 binary:"
          ./dist/ineedspace-darwin-arm64 --help
          echo "==> Testing Universal binary:"
          ./dist/ineedspace-darwin-universal --help

      - name: Package release archives & checksums
        run: |
          cd dist
          tar -czvf ineedspace-darwin-arm64.tar.gz ineedspace-darwin-arm64
          tar -czvf ineedspace-darwin-amd64.tar.gz ineedspace-darwin-amd64
          tar -czvf ineedspace-darwin-universal.tar.gz ineedspace-darwin-universal
          shasum -a 256 ineedspace-darwin-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ineedspace-macos-binaries
          path: |
            dist/ineedspace-darwin-arm64
            dist/ineedspace-darwin-amd64
            dist/ineedspace-darwin-universal
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
