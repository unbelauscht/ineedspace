name: Build macOS Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (ARM64, AMD64 & Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Run code validation
        run: go vet ./...

      - name: Build macOS binaries
        run: |
          mkdir -p dist
          APP_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "main" ]; then
            APP_VERSION="dev"
          fi
          echo "==> Building version: $APP_VERSION"
          LDFLAGS="-s -w -X main.version=${APP_VERSION}"

          echo "==> Building darwin/arm64 (Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ineedspace-darwin-arm64 .
          
          echo "==> Building darwin/amd64 (Intel)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ineedspace-darwin-amd64 .

      - name: Create Universal macOS binary
        run: |
          echo "==> Packaging Universal binary with lipo..."
          lipo -create -output dist/ineedspace-darwin-universal \
            dist/ineedspace-darwin-amd64 \
            dist/ineedspace-darwin-arm64
          
          echo "==> Binary verification:"
          file dist/ineedspace-*

      - name: Smoke test binary
        run: |
          chmod +x dist/ineedspace-*
          echo "==> Testing ARM64 binary:"
          ./dist/ineedspace-darwin-arm64 --version
          ./dist/ineedspace-darwin-arm64 --help
          echo "==> Testing Universal binary:"
          ./dist/ineedspace-darwin-universal --version
          ./dist/ineedspace-darwin-universal --help

      - name: Package release archives & checksums
        run: |
          cd dist
          tar -czvf ineedspace-darwin-arm64.tar.gz ineedspace-darwin-arm64
          tar -czvf ineedspace-darwin-amd64.tar.gz ineedspace-darwin-amd64
          tar -czvf ineedspace-darwin-universal.tar.gz ineedspace-darwin-universal
          shasum -a 256 ineedspace-darwin-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Generate Homebrew Formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.1.0"
          fi
          UNIVERSAL_SHA=$(shasum -a 256 dist/ineedspace-darwin-universal.tar.gz | awk '{print $1}')

          cp Formula/ineedspace.rb dist/ineedspace.rb
          sed -i.bak "s/sha256 \".*\"/sha256 \"${UNIVERSAL_SHA}\"/g" dist/ineedspace.rb
          sed -i.bak "s/download\/v[0-9.]*\/ineedspace/download\/v${VERSION}\/ineedspace/g" dist/ineedspace.rb
          rm -f dist/ineedspace.rb.bak
          echo "==> Generated Homebrew Formula:"
          cat dist/ineedspace.rb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ineedspace-macos-binaries
          path: |
            dist/ineedspace-darwin-arm64
            dist/ineedspace-darwin-amd64
            dist/ineedspace-darwin-universal
            dist/*.tar.gz
            dist/checksums.txt
            dist/ineedspace.rb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/ineedspace.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Formula to Homebrew Tap (if TAP_GITHUB_TOKEN configured)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN secret not set; skipping automatic push to unbelauscht/homebrew-tap."
            exit 0
          fi
          echo "==> Syncing formula to unbelauscht/homebrew-tap..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/unbelauscht/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Formula
          cp dist/ineedspace.rb tap-repo/Formula/ineedspace.rb
          cd tap-repo
          git add Formula/ineedspace.rb
          git commit -m "feat(formula): bump ineedspace to v${GITHUB_REF_NAME#v}" || echo "No changes to commit"
          git push origin main
